<!doctype html>
<html lang="es" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Valores por defecto: React los actualiza según idioma y página (src/hooks/useDocumentMeta.js) -->
    <title>José Antonio Gimeno San Martín · Software Engineer</title>
    <meta
      name="description"
      content="Portfolio de José Antonio Gimeno San Martín, estudiante de Ingeniería del Software (UCM) enfocado en desarrollo backend y web. Proyectos con Java, Spring Boot, Python, React y Docker."
    />
    <meta name="author" content="José Antonio Gimeno San Martín" />
    <meta name="theme-color" content="#233B5D" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="José Antonio Gimeno San Martín" />
    <meta property="og:title" content="José Antonio Gimeno San Martín · Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio de José Antonio Gimeno San Martín, estudiante de Ingeniería del Software (UCM) enfocado en desarrollo backend y web."
    />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_GB" />
    <!-- Las vistas previas al compartir el enlace necesitan URLs absolutas -->
    <meta property="og:image" content="https://joseagim.dev/profile-square.jpg" />
    <meta property="og:url" content="https://joseagim.dev/" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/profile-square.jpg" />

    <!-- Aplica tema e idioma antes del primer render para evitar parpadeos -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('theme')
          var dark = theme !== 'light' // oscuro por defecto; solo es claro si el usuario lo eligió
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var lang = localStorage.getItem('lang')
          if (lang !== 'es' && lang !== 'en') {
            lang = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en'
          }
          root.lang = lang
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta web necesita JavaScript. · This website requires JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
